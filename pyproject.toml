[project]
name = "gkmkb"
version = "0.0.1"
requires-python = ">=3.12"

[project.scripts]
gkmkb = "backend.gkmkb.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["docker: needs a running Docker daemon; skipped without one"]
pythonpath = ["."]
testpaths = ["contracts", "capture", "flowsight", "covertrace", "mimicnet", "backend", "eval", "scripts"]
