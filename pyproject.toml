[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["contracts", "capture", "flowsight", "covertrace", "mimicnet", "backend", "eval"]
