name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      # exit code 5 = no tests collected yet; allowed until the first module lands tests
      - run: pytest -q || [ $? -eq 5 ]

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for dashboard
        id: has
        run: |
          if [ -f dashboard/package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.found == 'true'
        with:
          node-version: 22
      - if: steps.has.outputs.found == 'true'
        working-directory: dashboard
        run: npm ci && npm run lint && npm run build
